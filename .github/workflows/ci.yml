name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, testes e cobertura)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduling-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers usa o Docker que já vem no runner ubuntu-latest
      - run: ./mvnw -B verify
      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: scheduling-api/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (testes e build)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduling-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scheduling-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
