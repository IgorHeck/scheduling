services:
  frontend:
    build:
      context: ./scheduling-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - scheduling-net

  backend:
    build:
      context: ./scheduling-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - logo_uploads:/app/uploads/logos
    networks:
      - scheduling-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-scheduling_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scheduling-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - scheduling-net

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - scheduling-net

volumes:
  postgres_data:
    external: true
    name: scheduling-api_postgres_data
  logo_uploads:

networks:
  scheduling-net:
    driver: bridge
